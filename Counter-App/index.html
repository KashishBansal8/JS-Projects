<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="counter-app">
        <h2>COUNTER APP</h2>
        <p id="counterVal">0</p>
        <div class="btn-cont">
            <button class="increment-btn" id="incrementBtn">+</button>
            <button class="decrement-btn" id="decrementBtn">-</button>
            <div>
                <input type="number" min="1" max="10" value="1" step="1" name="counterRangeSelector"
                    id="counterRangeSelector" />
            </div>
            <div class="reset-btn-cont">
                <button class="reset-btn" id="resetBtn">Reset</button>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
