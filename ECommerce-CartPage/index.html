<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECommerce Cart Page By Kashish Bansal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="ecommerce-cart-wrapper">
        <header class="flex header-cont">
            <h1>ECommerce Cart Page</h1>
            <div class="search-filter">
                <input type="text" name="searchBox" id="searchInput">
                <button id="searchBtn">Search</button>
            </div>
            <div class="cart-wrapper">
                Cart Items -
                <span class="cart-items" id="cartItems">0</span>
                <div class="show-cart-items" id="showCartItems">
                </div>
            </div>
        </header>
        <section class="product-card-wrapper flex" id="productCardWrapper">
            <span class="no-result-error">Oops! No Result Found.</span>
        </section>
    </section>
    <script src="index.js"></script>
</body>

</html>
